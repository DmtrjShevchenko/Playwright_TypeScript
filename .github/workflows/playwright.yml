name: Playwright Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Must be green: every test except the ones on known bugs. Any red test here is a new problem.
      - name: Regression (must be green)
        run: npm test

      # Informational: tests on known product bugs (tag @known-bug) are red while the bug exists.
      # Runs even when regression failed, never fails the job.
      - name: Known bugs (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run test:known-bugs

      - name: Upload HTML report (regression)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload HTML report (known bugs)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-known-bugs
          path: playwright-report-known-bugs/
          retention-days: 14

      - name: Upload bug reports
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: bug-reports
          path: bug-reports/
          retention-days: 14

      # Not `if: failure()`: the known-bugs step never fails the job, but its bug reports point to these traces.
      - name: Upload traces / screenshots of failed tests
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: |
            test-results/
            test-results-known-bugs/
          if-no-files-found: ignore
          retention-days: 7
